name: Update 1-Month Term SOFR

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 9 am EST (13:00 UTC), Mon–Fri
  workflow_dispatch:           # also allow manual trigger from GitHub UI

jobs:
  update-sofr:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest SOFR rate
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_sofr.py

      - name: Commit updated sofr.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Loan Calculator/sofr.json"
          git diff --cached --quiet || git commit -m "chore: update 1-Month Term SOFR rate [skip ci]"
          git push
